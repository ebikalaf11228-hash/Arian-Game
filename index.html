<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arian Game</title>
    <style>
        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #10102d, #173b72);
            color: white;
            text-align: center;
        }
        header {
            padding: 45px 15px;
            background: #09091c;
        }
        h1 {
            color: #00e5ff;
            font-size: 38px;
        }
        .container {
            padding: 30px 15px;
        }
        .game {
            background: #202c50;
            padding: 25px;
            margin: 20px auto;
            max-width: 400px;
            border-radius: 18px;
            box-shadow: 0 0 20px #00e5ff33;
        }
        button {
            background: #00e5ff;
            color: #10102d;
            border: none;
            border-radius: 10px;
            padding: 13px 25px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #00bcd4;
        }
        footer {
            padding: 20px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <header>
        <h1>🎮 Arian Game</h1>
        <p>به دنیای بازی‌ها خوش آمدید!</p>
    </header>

    <div class="container">
        <h2>🔥 بازی‌های پیشنهادی</h2>

        <div class="game">
            <h3>🕹️ بازی ماجراجویی</h3>
            <p>برای شروع ماجراجویی آماده‌ای؟</p>
            <button onclick="alert('به‌زودی این بازی اضافه می‌شود!')">
                شروع بازی
            </button>
        </div>

        <div class="game">
            <h3>🚀 بازی فضایی</h3>
            <p>به دنیای شگفت‌انگیز فضا سفر کن!</p>
            <button onclick="alert('به‌زودی این بازی اضافه می‌شود!')">
                شروع بازی
            </button>
        </div>
    </div>

    <footer>
        ساخته شده با ❤️ توسط Arian
    </footer>
</body>
</html>
